[package]
name = "ink-tablet"
description = "Pen tablet input (pressure, tilt) for macOS (NSEvent), Linux X11 (XInput2) and Wayland (tablet-v2)"
edition.workspace = true
license.workspace = true
version.workspace = true

[dependencies]
raw-window-handle = "0.6"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSGeometry"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "block2", "NSEvent", "NSResponder", "NSView", "NSWindow", "NSGraphics"] }
block2 = "0.6"

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
x11rb = { version = "0.13", features = ["xinput"] }
wayland-client = "0.31"
wayland-backend = { version = "0.3", features = ["client_system", "dlopen"] }
wayland-protocols = { version = "0.32", features = ["client"] }
