[package]
name = "inkstudio"
description = "Inkstudio: drawing app for manga and comics"
edition.workspace = true
license.workspace = true
version.workspace = true

[[bin]]
name = "inkstudio"
path = "src/main.rs"

[dependencies]
ink-core.workspace = true
ink-raster.workspace = true
ink-vector.workspace = true
ink-comic.workspace = true
ink-anim.workspace = true
ink-ui.workspace = true
ink-io.workspace = true
ink-tablet.workspace = true
serde.workspace = true
serde_json.workspace = true
egui_dock = { version = "0.21", features = ["serde"] }
ron = "0.12"
egui.workspace = true
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "wgpu", "wayland", "x11", "accesskit"] }
png.workspace = true
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp", "gif", "tiff"] }
rayon.workspace = true
rfd = { version = "0.15", optional = true }

[features]
default = []
# Native file dialogs (needs GTK on Linux).
dialogs = ["dep:rfd"]
